global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 24h
    timeout server 24h

frontend tls
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend credentials if { req.ssl_sni -i "${ICE_HOST}" }
    default_backend turn

backend credentials
    server credentials credentials:8443 check

backend turn
    server coturn coturn:5349 check
